[project]
name = "insightforge-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Subhadeep Majumder", email = "subhadlearner@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.23",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.7",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
insightforge-agent = "insightforge_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: needs a real model or server; run on demand with -m live"]
addopts = "-m 'not live'"

[tool.importlinter]
root_package = "insightforge_agent"

[[tool.importlinter.contracts]]
name = "domain imports nothing from the other packages"
type = "forbidden"
source_modules = ["insightforge_agent.domain"]
forbidden_modules = [
    "insightforge_agent.pipeline",
    "insightforge_agent.agents",
    "insightforge_agent.stores",
    "insightforge_agent.api",
    "insightforge_agent.scheduler",
    "insightforge_agent.config",
    "insightforge_agent.llm",
]

[[tool.importlinter.contracts]]
name = "production code never imports the benchmark"
type = "forbidden"
source_modules = [
    "insightforge_agent.domain",
    "insightforge_agent.pipeline",
    "insightforge_agent.agents",
    "insightforge_agent.stores",
    "insightforge_agent.api",
    "insightforge_agent.scheduler",
    "insightforge_agent.config",
    "insightforge_agent.llm",
    "insightforge_agent.embeddings",
    "insightforge_agent.demo",
]
forbidden_modules = ["insightforge_agent.benchmark"]

# benchmark -> production boundary (M1.3 baseline adapters call the real T5/T6 functions).
# Allowed: the pure logic modules (domain, pipeline.synthesize / extract / fact_check / write /
# deps / citations, stores.source_store / memory, embeddings). Banned: everything that builds a
# real model, opens a network connection, or runs the whole graph. The first contract bans model
# construction and the graph even through an import chain; the second bans direct imports of the
# remaining live or service modules. pipeline.deps imports agents.web, which imports config
# (settings only: no model, no call at import), so config can be banned directly but not through
# chains without refactoring production code, which M1.2 must not do.
[[tool.importlinter.contracts]]
name = "the benchmark never reaches model construction or the full pipeline graph"
type = "forbidden"
source_modules = ["insightforge_agent.benchmark"]
forbidden_modules = [
    "insightforge_agent.llm",
    "insightforge_agent.pipeline.wiring",
    "insightforge_agent.pipeline.graph",
]

[[tool.importlinter.contracts]]
name = "the benchmark imports no live, network or service module directly"
type = "forbidden"
source_modules = ["insightforge_agent.benchmark"]
forbidden_modules = [
    "insightforge_agent.agents",
    "insightforge_agent.config",
    "insightforge_agent.api",
    "insightforge_agent.scheduler",
    "insightforge_agent.stores.sqlite",
    "insightforge_agent.pipeline.dispatch",
    "insightforge_agent.demo",
]
allow_indirect_imports = true
